<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Images with Qwen2.5-VL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .image-upload-section {
            margin-top: 20px;
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }
        .image-upload-section:hover {
            background-color: #f0f0f0;
        }
        .image-upload-section p {
            margin: 0;
            color: #777;
        }
        .image-upload-section button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .image-upload-section button:hover {
            background-color: #0056b3;
        }
        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .image-preview img {
            max-width: 200px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .prompt-section {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            resize: vertical;
        }
        .add-image-button {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .add-image-button span {
            font-size: 24px;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analyze Images with Qwen2.5-VL</h1>
        <!-- Form untuk upload gambar -->
        <div class="image-upload-section">
            <p>Pilih Gambar</p>
            <p>Atau jatuhkan di sini</p>
            <button id="uploadButton">Unggah</button>
            <input type="file" id="images" name="images" accept="image/*" style="display: none;" multiple>
            <span class="add-image-button" id="addImageButton"><span>+</span></span>
        </div>
        <div id="imagePreview" class="image-preview"></div>
        <!-- Form untuk masukkan prompt -->
        <div id="promptSection" class="prompt-section" style="display: none;">
            <label for="prompt">Prompt:</label><br>
            <textarea id="prompt" name="prompt" rows="4" cols="50" placeholder="Enter your prompt here..."></textarea><br><br>
            <button id="analyzeButton" type="button">Analyze Images</button>
        </div>
        <!-- Hasil analisis -->
        <div id="result" style="margin-top: 20px;"></div>
    </div>
    <script>
        let uploadedImageUrls = []; // Array to store multiple image URLs

        // Event listener for the "Unggah" button
        document.getElementById('uploadButton').addEventListener('click', () => {
            document.getElementById('images').click();
        });

        // Event listener for the "+" icon
        document.getElementById('addImageButton').addEventListener('click', () => {
            document.getElementById('images').click();
        });

        // Event listener for file input change
        document.getElementById('images').addEventListener('change', async () => {
            const files = document.getElementById('images').files;
            if (!files || files.length === 0) return;

            try {
                const formData = new FormData();
                for (let i = 0; i < files.length; i++) {
                    formData.append('images', files[i]);
                }

                const response = await fetch('/upload_images', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log(data); // Debugging: Check JSON response
                if (data.image_urls && data.image_urls.length > 0) {
                    uploadedImageUrls = [...uploadedImageUrls, ...data.image_urls]; // Append new image URLs
                    // Display previews for all uploaded images
                    const imagePreviewDiv = document.getElementById('imagePreview');
                    imagePreviewDiv.innerHTML = ''; // Clear previous previews
                    uploadedImageUrls.forEach(url => {
                        const imgElement = document.createElement('img');
                        imgElement.src = url;
                        imgElement.style.maxWidth = '200px';
                        imgElement.style.height = 'auto';
                        imgElement.style.border = '1px solid #ddd';
                        imgElement.style.borderRadius = '8px';
                        imagePreviewDiv.appendChild(imgElement);
                    });
                    // Show prompt section
                    const promptSection = document.getElementById('promptSection');
                    promptSection.style.display = 'block';
                } else {
                    alert('Failed to get image URLs from server.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while uploading the images.');
            }
        });

        // Event listener for Analyze Images button (attached only once)
        document.getElementById('analyzeButton').addEventListener('click', async () => {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) {
                alert('Please enter a prompt.');
                return;
            }
            try {
                const response = await fetch('/analyze_images', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_urls: uploadedImageUrls, prompt })
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                    <h2>Qwen2.5-VL Response:</h2>
                    <p>${data.qwen_response}</p>
                `;
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while processing the request.');
            }
        });
    </script>
</body>
</html>
